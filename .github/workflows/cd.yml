name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: medk-portfolio
      REGION: europe-west1
      REPOSITORY: portfolio
      IMAGE_NAME: medk-portfolio
      SERVICE: portfolio-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t europe-west9-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${GITHUB_SHA} \
            .

      - name: Push Docker image
        run: |
          docker push \
            europe-west9-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${GITHUB_SHA}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image=europe-west9-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${GITHUB_SHA} \
            --region=$REGION \
            --platform=managed